name: adaptive-retail-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: arp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_retail}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
    name: arp-postgres-data
