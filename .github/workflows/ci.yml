name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arp
          POSTGRES_PASSWORD: arp_dev_password
          POSTGRES_DB: adaptive_retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arp -d adaptive_retail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://arp:arp_dev_password@localhost:5432/adaptive_retail?schema=public
      CORS_ORIGINS: http://localhost:5173
      APP_VERSION: ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.13
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: API e2e tests
        run: pnpm test:e2e

      - name: Database integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
